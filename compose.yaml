name: speroflow

services:
  reverse-proxy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      CADDY_EMAIL:
      APP_DOMAIN:
      KNOWLEDGE_DOMAIN:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - knowledge_edge
      - knowledge_storage_bridge
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      API_INTERNAL_BASE_URL: http://api:8080
      KNOWLEDGE_PORTAL_URL: https://${KNOWLEDGE_DOMAIN:-knowledge.example.com}
    expose:
      - "3000"
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

  db-migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/migrator.Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - postgres_password
      - redis_password
      - minio_access_key
      - minio_secret_key
      - service_jwt_private_key
      - service_jwt_public_key
    networks:
      - private
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Accounts__PublicWebOrigin: https://${APP_DOMAIN:-app.example.com}
      # Public signup for the main application. The admin/knowledge platform
      # bootstrap stays gated behind the admin_bootstrap_token secret.
      Accounts__AllowPublicRegistration: "true"
      # Email confirmation requires SMTP; it is optional and only enforced when
      # SMTP is fully provisioned. With SMTP unset, accounts are auto-confirmed.
      Accounts__RequireConfirmedEmail: "${ACCOUNTS_REQUIRE_CONFIRMED_EMAIL:-false}"
      Smtp__Host:
      Smtp__Port: "587"
      Smtp__Username:
      Smtp__FromAddress:
      Smtp__FromName: SperoFlow
      Smtp__UseSsl: "true"
      KnowledgePlatform__BaseUrl: http://knowledge-api:8080
      PublicIngress__TrustedHttpsHosts: ${APP_DOMAIN:-app.example.com},app.${APP_DOMAIN:-app.example.com},api.${APP_DOMAIN:-app.example.com}
      # Temporary production unblock while forwarded HTTPS handling is verified.
      # Set RELAX_ANTIFORGERY_SECURE_COOKIE=false to restore __Host- + Secure.
      Security__RelaxAntiforgerySecureCookie: "${RELAX_ANTIFORGERY_SECURE_COOKIE:-true}"
      IdentityServer__Enabled: "true"
      IdentityServer__Issuer: https://${APP_DOMAIN:-app.example.com}
      IdentityServer__KnowledgePortalClientId: speroflow-knowledge-portal
      IdentityServer__KnowledgePortalRedirectUri: https://${KNOWLEDGE_DOMAIN:-knowledge.example.com}/signin-oidc
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    expose:
      - "8080"
    secrets:
      - postgres_password
      - redis_password
      - minio_access_key
      - minio_secret_key
      - service_jwt_private_key
      - service_jwt_public_key
      - smtp_password
      - admin_bootstrap_token
      - oidc_signing_certificate
      - oidc_signing_certificate_password
      - oidc_encryption_certificate
      - oidc_encryption_certificate_password
    networks:
      - edge
      - private
      - knowledge_grant_bridge
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health/ready >/dev/null"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 10

  api-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    restart: unless-stopped
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    secrets:
      - postgres_password
      - redis_password
      - minio_access_key
      - minio_secret_key
      - service_jwt_private_key
      - service_jwt_public_key
    networks:
      - private
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: speroflow
      POSTGRES_USER: speroflow_app
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speroflow_app -d speroflow"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: ["/bin/sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$(cat /run/secrets/redis_password)\""]
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    networks:
      - private
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ["export NEO4J_AUTH=\"neo4j/$$(cat /run/secrets/neo4j_password)\"; exec /startup/docker-entrypoint.sh neo4j"]
    environment:
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1024m
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
    secrets:
      - neo4j_password
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$(cat /run/secrets/neo4j_password)\" 'RETURN 1' >/dev/null"]
      interval: 20s
      timeout: 10s
      start_period: 45s
      retries: 10

  object-storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ["export MINIO_ROOT_USER=\"$$(cat /run/secrets/minio_access_key)\"; export MINIO_ROOT_PASSWORD=\"$$(cat /run/secrets/minio_secret_key)\"; exec minio server /data"]
    secrets:
      - minio_access_key
      - minio_secret_key
    volumes:
      - minio_data:/data
    networks:
      - private
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 10

  ai-api:
    build:
      context: .
      dockerfile: ai-api/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_DATABASE: neo4j
      KNOWLEDGE_NEO4J_URI: bolt://knowledge-neo4j:7687
      KNOWLEDGE_NEO4J_USER: knowledge_reader
      KNOWLEDGE_NEO4J_DATABASE: neo4j
      KNOWLEDGE_GRANT_ISSUER: speroflow-knowledge-api
      KNOWLEDGE_GRANT_AUDIENCE: speroflow-ai
      KNOWLEDGE_GRANT_PUBLIC_KEY_PATH: /run/secrets/knowledge_grant_public_key
      LLM_PROVIDER: bedrock
      LLM_MODEL: ${BEDROCK_MODEL_ID:-amazon.nova-lite-v1:0}
      BEDROCK_REGION: ${BEDROCK_REGION:-us-east-1}
      SERVICE_JWT_ISSUER: speroflow-api
      SERVICE_JWT_AUDIENCE: speroflow-ai
      SERVICE_JWT_REQUIRED: "true"
      BALANCE_AGENT_ENABLED: "false"
    depends_on:
      neo4j:
        condition: service_healthy
    expose:
      - "8000"
    secrets:
      - neo4j_password
      - service_jwt_public_key
      - knowledge_neo4j_reader_password
      - knowledge_grant_public_key
    networks:
      - private
      - knowledge_read_bridge
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8000/health/ready | grep -q 'ready'"]
      interval: 20s
      timeout: 8s
      start_period: 45s
      retries: 10

  ai-worker:
    build:
      context: .
      dockerfile: ai-worker/Dockerfile
    restart: unless-stopped
    command: ["python", "/app/worker_main.py"]
    environment:
      APP_ENV: production
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_DATABASE: neo4j
      PRIMARY_API_URL: http://api:8080
      AI_JOBS_STREAM: speroflow:ai:jobs
      AI_JOBS_GROUP: speroflow-ai-workers
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    secrets:
      - neo4j_password
      - redis_password
    networks:
      - private
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  llm-runtime:
    image: vllm/vllm-openai:v0.8.5
    profiles: ["gpu"]
    restart: unless-stopped
    command: ["--model", "google/gemma-4-27b-it", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      HF_HOME: /models
    volumes:
      - llm_model_cache:/models
    expose:
      - "8000"
    networks:
      - private
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  edge:
    name: speroflow_edge
  private:
    name: speroflow_private
    internal: true
  knowledge_edge:
    name: speroflow_knowledge_edge
    external: true
  knowledge_grant_bridge:
    name: speroflow_knowledge_grant_bridge
    external: true
  knowledge_read_bridge:
    name: speroflow_knowledge_read_bridge
    external: true
  knowledge_storage_bridge:
    name: speroflow_knowledge_storage_bridge
    external: true

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  minio_data:
  llm_model_cache:

secrets:
  postgres_password:
    file: ./infrastructure/secrets/postgres_password
  redis_password:
    file: ./infrastructure/secrets/redis_password
  neo4j_password:
    file: ./infrastructure/secrets/neo4j_password
  minio_access_key:
    file: ./infrastructure/secrets/minio_access_key
  minio_secret_key:
    file: ./infrastructure/secrets/minio_secret_key
  service_jwt_private_key:
    file: ./infrastructure/secrets/service_jwt_private_key
  service_jwt_public_key:
    file: ./infrastructure/secrets/service_jwt_public_key
  smtp_password:
    file: ./infrastructure/secrets/smtp_password
  oidc_signing_certificate:
    file: ./infrastructure/secrets/oidc_signing_certificate
  oidc_signing_certificate_password:
    file: ./infrastructure/secrets/oidc_signing_certificate_password
  oidc_encryption_certificate:
    file: ./infrastructure/secrets/oidc_encryption_certificate
  oidc_encryption_certificate_password:
    file: ./infrastructure/secrets/oidc_encryption_certificate_password
  knowledge_neo4j_reader_password:
    file: ./infrastructure/secrets/knowledge_neo4j_reader_password
  knowledge_grant_public_key:
    file: ./infrastructure/secrets/knowledge_grant_public_key
  admin_bootstrap_token:
    file: ./infrastructure/secrets/admin_bootstrap_token
