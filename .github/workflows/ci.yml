name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-guard:
    name: Secret pattern guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked files for secret patterns
        shell: pwsh
        run: ./scripts/check-no-secrets.ps1
      - name: Secrets catalog vs Compose
        shell: pwsh
        run: ./scripts/validate-secrets-catalog.ps1
      - name: Managed secrets push/pull dry-run
        shell: pwsh
        run: |
          ./scripts/aws-secrets-push.ps1 -Environment prod -Region us-east-1 -DryRun
          ./scripts/aws-secrets-pull.ps1 -Environment prod -Region us-east-1 -DryRun
      - name: Validate secrets CloudFormation template
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("infrastructure/aws/speroflow-secrets-stack.yaml")
          text = path.read_text(encoding="utf-8")
          # CFN uses YAML tags (!Ref, !Sub, !Equals) that PyYAML safe_load rejects;
          # structural string checks are enough for CI without cfn-lint.
          required = [
              "AWSTemplateFormatVersion",
              "SecretsKmsKey",
              "SecretsKmsAlias",
              "Ec2SecretsReadPolicy",
              "Ec2SecretsAdminPolicy",
              "Ec2InstanceRole",
              "Ec2InstanceProfile",
              "speroflow/${EnvironmentName}/",
              "alias/speroflow-secrets-",
          ]
          missing = [r for r in required if r not in text]
          if missing:
              raise SystemExit(f"CFN template missing expected fragments: {missing}")
          print("CloudFormation template OK:", path)
          PY
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose-validate:
    name: Compose validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose files
        run: |
          docker compose -f compose.yaml config >/dev/null
          docker compose -f compose.yaml -f compose.prod.yaml config >/dev/null
          docker compose -f compose.yaml -f compose.gpu.yaml --profile gpu config >/dev/null
          docker compose -f compose.yaml -f compose.monitoring.yaml --profile monitoring config >/dev/null
          docker compose -f knowledge-platform/compose.yaml config >/dev/null
          echo "All Compose configurations are valid."
      - name: Ensure prod override keeps unique service keys
        run: |
          # Guard against accidental duplicate YAML keys under services: (last-key-wins footgun).
          python - <<'PY'
          from pathlib import Path
          text = Path("compose.prod.yaml").read_text(encoding="utf-8")
          services = False
          seen = set()
          dups = []
          for line in text.splitlines():
              if line.startswith("services:"):
                  services = True
                  continue
              if services and line and not line.startswith(" ") and not line.startswith("\t") and line.strip() and not line.strip().startswith("#"):
                  services = False
              if services and line.startswith("  ") and not line.startswith("   ") and line.strip().endswith(":"):
                  name = line.strip()[:-1]
                  if name in seen:
                      dups.append(name)
                  seen.add(name)
          if dups:
              raise SystemExit(f"Duplicate service keys in compose.prod.yaml: {dups}")
          print("compose.prod.yaml service keys OK:", sorted(seen))
          PY

  backend-test:
    name: Backend domain tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test domain
        run: dotnet test backend/tests/SperoFlow.Domain.Tests/SperoFlow.Domain.Tests.csproj --configuration Release --nologo
      - name: Vulnerable package report (informational)
        continue-on-error: true
        run: |
          dotnet restore backend/SperoFlow.sln
          dotnet list backend/SperoFlow.sln package --vulnerable --include-transitive || true

  knowledge-test:
    name: Knowledge infrastructure tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test knowledge infrastructure
        run: dotnet test knowledge-platform/backend/tests/SperoFlow.Knowledge.Infrastructure.Tests/SperoFlow.Knowledge.Infrastructure.Tests.csproj --configuration Release --nologo

  ai-core-test:
    name: AI-core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight test deps
        run: |
          python -m pip install --upgrade pip
          pip install "pydantic>=2.9.0" "pydantic-settings>=2.6.0" "PyJWT[crypto]>=2.10.0" "httpx>=0.27.0" "cryptography>=43.0.0" pytest
          pip install -e ai-core
      - name: Run offline-friendly AI tests
        working-directory: ai-core
        env:
          APP_ENV: development
          LLM_PROVIDER: keyword
          ROUTER_PROVIDER: keyword
        run: |
          python -m pytest tests \
            --ignore=tests/test_roberta_classifier.py \
            -q

  frontend-check:
    name: Frontend test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: npm audit (high/critical)
        continue-on-error: true
        run: npm audit --audit-level=high

  e2e-smoke-syntax:
    name: E2E smoke script syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse e2e-smoke module
        run: node --check scripts/e2e-smoke.mjs
      - name: Run smoke without live stack (skip unreachable)
        run: node scripts/e2e-smoke.mjs
        env:
          APP_BASE_URL: http://127.0.0.1:9
          REQUIRE_STACK: "0"

  playwright-e2e-mocked:
    name: Playwright E2E (mocked login/CSRF/proposals)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install e2e deps
        working-directory: e2e
        run: npm install
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install chromium --with-deps
      - name: Run mocked Playwright suite
        working-directory: e2e
        run: npm run test:mocked
        env:
          CI: "true"
