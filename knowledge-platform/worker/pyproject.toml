[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "speroflow-knowledge-worker"
version = "0.1.0"
description = "Private, worker-only source ingestion and graph publication for SperoFlow knowledge."
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]