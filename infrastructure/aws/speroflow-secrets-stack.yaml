AWSTemplateFormatVersion: "2010-09-09"
Description: >
  SperoFlow managed secrets foundation — KMS CMK for Secrets Manager,
  instance read role/policy, and optional admin manage policy.
  Does not create secret values (use scripts/aws-secrets-push.ps1 after bootstrap).

Parameters:
  EnvironmentName:
    Type: String
    Default: prod
    AllowedPattern: "^[a-z0-9-]+$"
    Description: Environment segment in secret names speroflow/{env}/*

  DeployRoleName:
    Type: String
    Default: speroflow-ec2-secrets-role
    Description: IAM role name for the deploy EC2 instance (created if missing path below).

  CreateInstanceRole:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Create a new EC2 instance role with Secrets Manager read access.

  CreateAdminPolicy:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Create a break-glass admin managed policy for push/rotate (attach manually).

Conditions:
  ShouldCreateInstanceRole: !Equals [!Ref CreateInstanceRole, "true"]
  ShouldCreateAdminPolicy: !Equals [!Ref CreateAdminPolicy, "true"]

Resources:
  SecretsKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub SperoFlow Secrets Manager CMK (${EnvironmentName})
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableRootAccountAdmin
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowSecretsManager
            Effect: Allow
            Principal:
              Service: secretsmanager.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:CreateGrant
              - kms:DescribeKey
            Resource: "*"
            Condition:
              StringEquals:
                kms:ViaService: !Sub secretsmanager.${AWS::Region}.amazonaws.com

  SecretsKmsAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/speroflow-secrets-${EnvironmentName}
      TargetKeyId: !Ref SecretsKmsKey

  Ec2SecretsReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub speroflow-${EnvironmentName}-secrets-read
      Description: Read speroflow/{env}/* secrets and decrypt with SperoFlow CMK
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ListSecrets
            Effect: Allow
            Action:
              - secretsmanager:ListSecrets
            Resource: "*"
          - Sid: ReadEnvironmentSecrets
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:speroflow/${EnvironmentName}/*
          - Sid: DecryptSecrets
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource: !GetAtt SecretsKmsKey.Arn
            Condition:
              StringEquals:
                kms:ViaService: !Sub secretsmanager.${AWS::Region}.amazonaws.com

  Ec2SecretsAdminPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: ShouldCreateAdminPolicy
    Properties:
      ManagedPolicyName: !Sub speroflow-${EnvironmentName}-secrets-admin
      Description: Create/update speroflow/{env}/* secrets (break-glass / admin SSO)
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ManageEnvironmentSecrets
            Effect: Allow
            Action:
              - secretsmanager:CreateSecret
              - secretsmanager:PutSecretValue
              - secretsmanager:UpdateSecret
              - secretsmanager:DescribeSecret
              - secretsmanager:GetSecretValue
              - secretsmanager:TagResource
              - secretsmanager:ListSecrets
            Resource:
              - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:speroflow/${EnvironmentName}/*
          - Sid: EncryptDecrypt
            Effect: Allow
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:GenerateDataKey
              - kms:DescribeKey
            Resource: !GetAtt SecretsKmsKey.Arn
            Condition:
              StringEquals:
                kms:ViaService: !Sub secretsmanager.${AWS::Region}.amazonaws.com

  Ec2InstanceRole:
    Type: AWS::IAM::Role
    Condition: ShouldCreateInstanceRole
    Properties:
      RoleName: !Ref DeployRoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref Ec2SecretsReadPolicy
      Tags:
        - Key: Application
          Value: SperoFlow
        - Key: Environment
          Value: !Ref EnvironmentName

  Ec2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: ShouldCreateInstanceRole
    Properties:
      InstanceProfileName: !Sub ${DeployRoleName}-profile
      Roles:
        - !Ref Ec2InstanceRole

Outputs:
  KmsKeyArn:
    Description: CMK ARN for Secrets Manager
    Value: !GetAtt SecretsKmsKey.Arn
  KmsKeyAlias:
    Description: CMK alias
    Value: !Sub alias/speroflow-secrets-${EnvironmentName}
  SecretsReadPolicyArn:
    Description: Attach to existing EC2 roles if CreateInstanceRole=false
    Value: !Ref Ec2SecretsReadPolicy
  SecretsAdminPolicyArn:
    Condition: ShouldCreateAdminPolicy
    Description: Attach to admin/SSO users for aws-secrets-push.ps1
    Value: !Ref Ec2SecretsAdminPolicy
  InstanceProfileArn:
    Condition: ShouldCreateInstanceRole
    Description: Attach this instance profile to the deploy EC2
    Value: !GetAtt Ec2InstanceProfile.Arn
  SecretNamePrefix:
    Description: Prefix for secret names
    Value: !Sub speroflow/${EnvironmentName}/
  NextSteps:
    Description: Operator follow-up
    Value: >
      1) Attach instance profile to EC2.
      2) Grant admin policy to SSO role for push.
      3) bootstrap-secrets.ps1 then aws-secrets-pull/push with -KmsKeyId alias/speroflow-secrets-${EnvironmentName}.
      4) Enable speroflow-secrets-pull.service on the host.
