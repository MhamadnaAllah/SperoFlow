global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert.rules.yml"

scrape_configs:
  - job_name: speroflow-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: speroflow-api

  - job_name: speroflow-ai-api
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-api:8000"]
        labels:
          service: speroflow-ai-api
